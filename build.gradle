// Optional: Make it easy to run + integrate into build
tasks.named("build") {
//    dependsOn("openApiGenerate")
}

// OpenAPI Generation - more reliable for slow-starting apps
openApi {
    apiDocsUrl.set("http://localhost:18080/v3/api-docs")

    outputDir.set(layout.buildDirectory.dir("openapi"))
    outputFileName.set("openapi.json")

    waitTimeInSeconds.set(120)

    customBootRun {
        args = [
                "--spring.profiles.active=openapi-gen",
                "--server.port=18080",
                "--server.servlet.context-path=",
                "--springdoc.api-docs.enabled=true",
                "--springdoc.swagger-ui.enabled=false"//,
 //               "--spring.security.enabled=false"   // this is ignored by Spring, but we use profile instead
        ]
    }
}


springBoot {
    buildInfo()
}

processResources {
    exclude '**/*.proto'
}
protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.3'
    }

    generateProtoTasks {
        all().each { task ->
            // add any plugins here if needed (e.g. grpc)
        }
    }
}

// Ensures generated sources are included in the compile classpath
sourceSets {
    main {
        proto {
            srcDir 'src/main/proto'
        }
        java {
            srcDir 'build/generated/source/proto/main/java'
        }
    }
}

tasks.named("compileJava") {
    dependsOn("generateProto")
}

tasks.named("compileTestJava") {
    dependsOn("generateTestProto")
}

tasks.named('build') {
    dependsOn ("generateOpenApiDocs")
}
tasks.named('bootJar') {
    dependsOn generateOpenApiDocs
}

tasks.named('test') {
    systemProperty 'spring.profiles.active', 'openapi-gen'
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }

}

tasks.register("printVersion") {
    doLast {
        println project.version
    }
}


