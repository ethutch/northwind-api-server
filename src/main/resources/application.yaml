  jmx:
   enabled: true

management:
  endpoints:
    jmx:
      exposure:
        include: "*"
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      access: read_only
    health:
      show-details: always
  info:
    git:
      mode: full

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  config: classpath:log4j2-spring.xml
  level:
    org.hibernate.sql: info
    org.hibernate.orm.results: info
    org.springframework.security: info
    org.springframework.web: info
    org.springframework.integration              : INFO
    com.jetsys.northwindapiserver: trace
    org.springframework.cloud.stream: info
    org.apache.kafka: info
    org.springframework.cloud.stream.binder.kafka: info
    io.apicurio                                  : debug
    org.springframework.cloud.stream.binder.AbstractMessageChannelBinder: trace
    root                         : info

---

spring:
  config:
    activate:
      on-profile: localTest
  datasource:
    url: "jdbc:postgresql://localhost:5432/northwind"
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092

          producer-properties:
            apicurio:
              registry:
                url:  http://localhost:8081/apis/registry/v2

server:
  port: 18080
  servlet:
    context-path: ""

