spring:
  application:
    name: "northwind-api-server"
  datasource:
    url: "jdbc:postgresql://host.docker.internal:5432/northwind"
    username                  : "postgres"
    password                  : "passw0rd!"
    driver-class-name         : org.postgresql.Driver

    hikari:
      connection-timeout      : 20000
      idle-timeout            : 30000
      max-lifetime            : 1800000
      maximum-pool-size       : 3
      minimum-idle            : 1
      pool-name               : PostgresHikariCP
      connection-test-query   : SELECT 1
      leak-detection-threshold: 3000
  security:
    user:
      name: prometheus
      password: passw0rd!
      roles: PROMETHEUS

  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto  : none

