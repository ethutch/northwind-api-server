# Default values for northwind.
# Declare variables to be passed into your templates.

javaToolOptions: >-
  -Dcom.sun.management.jmxremote
  -Dcom.sun.management.jmxremote.authenticate=false
  -Dcom.sun.management.jmxremote.ssl=false
  -Dcom.sun.management.jmxremote.local.only=false
  -Dcom.sun.management.jmxremote.port=5099
  -Dcom.sun.management.jmxremote.rmi.port=5099
  -Djava.rmi.server.hostname=127.0.0.1
  -XX:+HeapDumpOnOutOfMemoryError
  -XX:HeapDumpPath=/tmp/heapdump.hprof
  -XX:+ExitOnOutOfMemoryError
  -Xms500m
  -Xmx1g
  -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5006

replicaCount: 1

image:
  repository: northwind-api-server  # Your Docker image
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.1.0"

nameOverride: ""
fullnameOverride: northwind-api-service

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: LoadBalancer
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a comment, uncomment if you need them
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes for the pod
volumeMounts:
  - mountPath: /tmp
    name: tmp-vol

volumes:
  - name: tmp-vol
    emptyDir:
      sizeLimit: 2Gi

nodeSelector: {}

tolerations: []

affinity: {}

## Grok crap below here
httpRoute:
  enabled: false  # Keeps the resource disabled/skipped safely

global:
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace \"+\" \"_\" }}"
